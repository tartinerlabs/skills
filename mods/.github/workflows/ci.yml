name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mods: ${{ steps.list.outputs.mods }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: List mods
        id: list
        run: echo "mods=$(printf '%s\n' plugins/*/ | sed 's#^plugins/##; s#/$##' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  marketplace:
    name: marketplace (${{ matrix.claude-code }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        claude-code: [stable, latest]
    env:
      CLAUDE_CODE_VERSION: ${{ matrix.claude-code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024  # v3.0.0
        with:
          version: 12.4.1
          runtime: node@lts
      - name: Validate marketplace
        run: pnpm dlx @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION plugin validate --strict .

  mods:
    name: ${{ matrix.mod }} (${{ matrix.claude-code }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        claude-code: [stable, latest]
        mod: ${{ fromJSON(needs.discover.outputs.mods) }}
    env:
      CLAUDE_CODE_VERSION: ${{ matrix.claude-code }}
      MOD_DIR: plugins/${{ matrix.mod }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024  # v3.0.0
        with:
          version: 12.4.1
          runtime: node@lts
      - name: Validate mod
        run: pnpm dlx @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION plugin validate --strict "$MOD_DIR"
      - name: Test mod
        run: pnpm dlx @anthropic-ai/claude-code@$CLAUDE_CODE_VERSION plugin test "$MOD_DIR"
