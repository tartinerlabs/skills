name: Skills

permissions:
  contents: read

on:
  schedule:
    - cron: "0 1 * * *"
  push:
    branches:
      - main
    paths:
      - plugins/*/skills/**
      - xcode-skills/**

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: skills.sh
            command: pnpm dlx skills add tartinerlabs/skills --yes
          - name: skills.sh (xcode-skills)
            command: pnpm dlx skills add https://github.com/tartinerlabs/skills/tree/main/xcode-skills --yes
    name: Install via ${{ matrix.name }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      # Defaults: pnpm and Node come from `devEngines` in the root package.json.
      # The commands below exercise consumer-side `pnpm dlx` tools.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4  # v3.1.1

      - name: Install
        run: ${{ matrix.command }}

  notify:
    runs-on: ubuntu-latest
    needs: install
    if: failure()
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -fsSL "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"Skills workflow failed\",\"url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"color\":15548997}]}"
