name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      # Go is preinstalled on GitHub-hosted runners; the validator has no
      # dependencies beyond the standard library.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - run: go run ./scripts/validate-skills

      - run: go test ./...

      # The TypeScript port runs beside the Go validator until Go is removed.
      # pnpm and Node come from devEngines in package.json, and the action
      # installs the locked dependencies.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4  # v3.1.1

      - run: pnpm turbo run typecheck test

      - name: Go and TypeScript validators agree
        run: |
          go build -o "$RUNNER_TEMP/validate-skills" ./scripts/validate-skills
          go_status=0
          ts_status=0
          "$RUNNER_TEMP/validate-skills" > "$RUNNER_TEMP/go.txt" 2>&1 || go_status=$?
          pnpm exec node packages/validate-skills/src/main.ts > "$RUNNER_TEMP/ts.txt" 2>&1 || ts_status=$?
          diff "$RUNNER_TEMP/go.txt" "$RUNNER_TEMP/ts.txt"
          test "$go_status" -eq "$ts_status"
